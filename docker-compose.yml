services:
  lastfmrobot:
    build: .
    image: lastfmrobot
    restart: unless-stopped
    environment:
      - RUST_LOG=debug
    volumes:
      - ./NotoSerifCJK.ttc:/app/NotoSerifCJK.ttc:ro
      - ./users.sqlite:/app/users.sqlite
    networks:
      - default
      # happyloltroll's Koito lives in another compose project on the same
      # host; join its network so the bot reaches it at http://koito:4110.
      - koito_default

networks:
  koito_default:
    external: true
